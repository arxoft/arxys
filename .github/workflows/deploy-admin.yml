name: Deploy Admin
on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install admin dependencies
        working-directory: admin
        run: npm install --legacy-peer-deps
      - name: Build
        working-directory: admin
        run: npm run build
      - name: Deploy admin Worker
        working-directory: admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
      # Redeploy API Worker after admin deploy to prevent route displacement
      - name: Install API dependencies
        working-directory: api
        run: npm install --legacy-peer-deps
      - name: Redeploy API Worker
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
          RESEND_DOMAIN:        ${{ secrets.RESEND_DOMAIN }}
        run: |
          jq -n '{RESEND_API_KEY: env.RESEND_API_KEY, RESEND_DOMAIN: env.RESEND_DOMAIN}' > "$RUNNER_TEMP/secrets.json"
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json"
          rm -f "$RUNNER_TEMP/secrets.json"
