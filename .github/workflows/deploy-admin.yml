name: Deploy Admin

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: admin
        run: npm install --legacy-peer-deps

      - name: Build
        working-directory: admin
        run: npm run build

      - name: Deploy Admin Worker
        working-directory: admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      # Re-deploy API after admin to prevent route displacement.
      # Both workers share the same zone — parallel deploys race to register
      # routes and one can knock the other out. Re-deploying API last ensures
      # its route is always current.
      - name: Re-assert API route
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
          RESEND_DOMAIN:        ${{ secrets.RESEND_DOMAIN }}
        run: |
          npm install --legacy-peer-deps
          jq -n '{RESEND_API_KEY: env.RESEND_API_KEY, RESEND_DOMAIN: env.RESEND_DOMAIN}' > "$RUNNER_TEMP/secrets.json"
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json"
          rm -f "$RUNNER_TEMP/secrets.json"

      - name: Run test suite
        working-directory: api
        env:
          ARXYS_API_KEY:   ${{ secrets.ARXYS_API_KEY }}
          ARXYS_WORKSPACE: ${{ secrets.ARXYS_WORKSPACE }}
        run: |
          sleep 5
          bash test.sh
