name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: api
        run: npm install --legacy-peer-deps

      - name: Deploy Worker with secrets
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY:            ${{ secrets.RESEND_API_KEY }}
          RESEND_DOMAIN:             ${{ secrets.RESEND_DOMAIN }}
          GITHUB_APP_ID:             ${{ secrets.GH_APP_ID }}
          GITHUB_APP_PRIVATE_KEY:    ${{ secrets.GH_APP_PRIVATE_KEY }}
        run: |
          for v in RESEND_API_KEY RESEND_DOMAIN; do
            [ -n "${!v}" ] || { echo "::error::GitHub secret $v is empty"; exit 1; }
          done
          jq -n '{
            RESEND_API_KEY:         env.RESEND_API_KEY,
            RESEND_DOMAIN:          env.RESEND_DOMAIN,
            GH_APP_ID:              env.GITHUB_APP_ID,
            GH_APP_PRIVATE_KEY:     env.GITHUB_APP_PRIVATE_KEY
          }' > "$RUNNER_TEMP/secrets.json"
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json"
          rm -f "$RUNNER_TEMP/secrets.json"

      - name: Run test suite
        working-directory: api
        env:
          ARXYS_API_KEY:   ${{ secrets.ARXYS_API_KEY }}
          ARXYS_WORKSPACE: ${{ secrets.ARXYS_WORKSPACE }}
        run: |
          sleep 5
          bash test.sh
