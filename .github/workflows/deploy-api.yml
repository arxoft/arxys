name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Wrangler 4 requires Node 22+
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: api
        run: npm install --legacy-peer-deps

      # Code and secrets ship together in one Worker version, so a deploy can
      # never go live without them. GitHub repo secrets are the source of truth.
      - name: Deploy Worker with secrets
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
          RESEND_DOMAIN:        ${{ secrets.RESEND_DOMAIN }}
        run: |
          for v in RESEND_API_KEY RESEND_DOMAIN; do
            [ -n "${!v}" ] || { echo "::error::GitHub secret $v is empty"; exit 1; }
          done
          jq -n '{RESEND_API_KEY: env.RESEND_API_KEY, RESEND_DOMAIN: env.RESEND_DOMAIN}' > "$RUNNER_TEMP/secrets.json"
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json"
          rm -f "$RUNNER_TEMP/secrets.json"
