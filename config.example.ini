# ~/.notion/config
# Copy this file to ~/.notion/config and fill in your values.
# This file is gitignored — never commit it.
#
# Resolution rule: block-level values always win over [default].
#
# api_key is per-project — each project has its own Notion integration.
# user and user_email are global and belong in [default] only.

[default]
user=yourname@example.com
user_email=yourname@example.com

# -------------------------------------------------------------------
# One block per project. Each project has its own api_key and database_id.
# Get the database_id from the board URL:
#   https://app.notion.com/p/<DATABASE_ID>?v=...
# Get the api_key from notion.so/profile/integrations.
# -------------------------------------------------------------------

[my-app]
api_key=secret_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
database_id=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

[ventures]
api_key=secret_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
database_id=yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy

[client-x]
api_key=secret_yyy                   # different integration for this client
database_id=zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz

# -------------------------------------------------------------------
# Optional keys (either in [default] or a project block):
#
#   title_property_name=Task name    # title column name (default: Task name)
# -------------------------------------------------------------------
